# Copy to pilot.env.yaml, replace all values marked REPLACE_, and review before use.
# This is shared by the API and worker. It contains no secret values.
WL_APP_MODE: pilot
WL_USE_EMULATORS: 'false'
WL_GCP_PROJECT: REPLACE_WITH_REAL_PROJECT_ID

WL_ALLOWED_ORIGINS: '["https://REPLACE_WITH_PROJECT_ID.web.app","https://REPLACE_WITH_PROJECT_ID.firebaseapp.com"]'
WL_ARTIFACT_BUCKET: REPLACE_WITH_PRIVATE_BUCKET_NAME
WL_TASKS_QUEUE: projects/REPLACE_WITH_PROJECT_ID/locations/asia-south1/queues/waterlens-jobs
WL_WORKER_URL: https://REPLACE_WITH_WORKER_SERVICE_URL
WL_WORKER_AUDIENCE: https://REPLACE_WITH_WORKER_SERVICE_URL
WL_TASKS_SERVICE_ACCOUNT: wl-task-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com
WL_WORKER_INVOKERS: '["wl-task-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com","wl-eventarc-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com","wl-scheduler-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com"]'

# No invited testers and no model budget means the live model remains unavailable.
# Owner must explicitly choose a non-empty tester UID list and USD allowance before opt-in.
WL_AI_ENABLED: 'false'
WL_AI_KILL_SWITCH: 'true'
WL_AI_OPEN_TO_ALL: 'false'
WL_AI_INVITED_TESTERS: '[]'
WL_AI_MODEL: gemini-2.5-flash
WL_AI_LOCATION: global
WL_AI_DAILY_REQUEST_LIMIT: '100'
WL_AI_MAX_CALLS_PER_RUN: '5'
WL_AI_TRANSIENT_RETRIES: '2'
WL_AI_REQUEST_TIMEOUT_SECONDS: '30'
WL_AI_RESERVATION_TTL_SECONDS: '300'
WL_AI_RUN_TTL_SECONDS: '3600'
