# Copy to pilot.env.yaml, replace all values marked REPLACE_, and review before use.
# This is shared by the API and worker. It contains no secret values.
WP_APP_MODE: pilot
WP_USE_EMULATORS: 'false'
WP_GCP_PROJECT: REPLACE_WITH_REAL_PROJECT_ID

WP_ALLOWED_ORIGINS: '["https://REPLACE_WITH_PROJECT_ID.web.app","https://REPLACE_WITH_PROJECT_ID.firebaseapp.com"]'
WP_ARTIFACT_BUCKET: REPLACE_WITH_PRIVATE_BUCKET_NAME
WP_TASKS_QUEUE: projects/REPLACE_WITH_PROJECT_ID/locations/asia-south1/queues/waterpilot-jobs
WP_WORKER_URL: https://REPLACE_WITH_WORKER_SERVICE_URL
WP_WORKER_AUDIENCE: https://REPLACE_WITH_WORKER_SERVICE_URL
WP_TASKS_SERVICE_ACCOUNT: wp-task-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com
WP_WORKER_INVOKERS: '["wp-task-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com","wp-eventarc-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com","wp-scheduler-invoker@REPLACE_WITH_PROJECT_ID.iam.gserviceaccount.com"]'

# No invited testers and no model budget means the live model remains unavailable.
# Owner must explicitly choose a non-empty tester UID list and USD allowance before opt-in.
WP_AI_ENABLED: 'false'
WP_AI_KILL_SWITCH: 'true'
WP_AI_OPEN_TO_ALL: 'false'
WP_AI_INVITED_TESTERS: '[]'
WP_AI_MODEL: gemini-2.5-flash
WP_AI_LOCATION: global
WP_AI_DAILY_REQUEST_LIMIT: '100'
WP_AI_MAX_CALLS_PER_RUN: '5'
WP_AI_TRANSIENT_RETRIES: '2'
WP_AI_REQUEST_TIMEOUT_SECONDS: '30'
WP_AI_RESERVATION_TTL_SECONDS: '300'
WP_AI_RUN_TTL_SECONDS: '3600'
