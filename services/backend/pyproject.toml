[project]
name = "waterlens-backend"
version = "0.1.0"
description = "WaterLens backend — FastAPI modular monolith (api, worker, domain, application, adapters)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "strawberry-graphql[fastapi]>=0.332.1,<0.333",
    "firebase-admin>=7.7.0,<8",
    "google-cloud-firestore>=2.34.1,<3",
    "google-cloud-storage>=3.17.0,<4",
    "google-cloud-tasks>=2.26.0,<3",
    "httpx>=0.28.1,<0.29",
    "babel>=2.18,<3",
    "tzfpy>=2.1,<3",
]

[dependency-groups]
# Installed by `uv sync` for local development.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema[format-nongpl]>=4.23",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    "cryptography>=50.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterlens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Emulator tests need a running Firebase Auth emulator: `npm run test:emulator`.
addopts = "-q -m 'not emulator and not live'"
markers = [
    "emulator: needs a running Firebase Auth emulator (npm run test:emulator)",
    "live: talks to a real Google Cloud project; opt-in only (see tests/live)",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy", "strawberry.ext.mypy_plugin"]

[[tool.mypy.overrides]]
# Strawberry's field/mutation decorators lose their typing when given keyword
# arguments (e.g. description=); resolver bodies are still fully checked.
module = "waterlens.api.graphql.modules.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# firebase-admin ships no type information; its use is confined to adapters/auth_firebase.py,
# which converts every result into typed domain values.
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
