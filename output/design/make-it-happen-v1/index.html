<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WaterPilot · Funding & proposal drawer · Design preview</title>
    <style>
      :root {
        --bg: #f4f9fc;
        --surface: #fff;
        --sunken: #edf4fa;
        --text: #101a40;
        --muted: #53637c;
        --line: #d6e1ed;
        --accent: #08777a;
        --soft: #e2f2f3;
        --green: #166534;
        --green-bg: #e5f4ea;
        --amber: #8a3d0b;
        --amber-bg: #fdf1df;
        --on: #fff;
        --shadow: 0 4px 22px #10233805;
      }
      html[data-theme='dark'] {
        --bg: #081724;
        --surface: #102338;
        --sunken: #142a40;
        --text: #e8f2ff;
        --muted: #a8bbcf;
        --line: #29425c;
        --accent: #39c6c6;
        --soft: #123a49;
        --green: #6ee7a0;
        --green-bg: #10291b;
        --amber: #fcd34d;
        --amber-bg: #2e2408;
        --on: #06212a;
        --shadow: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        color: var(--text);
        font-weight: 650;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .primary {
        background: var(--accent);
        color: var(--on);
        border-color: var(--accent);
      }
      .secondary {
        border-color: var(--accent);
        color: var(--accent);
      }
      .link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .small {
        padding: 5px 10px;
        font-size: 12px;
      }
      .icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .brand {
        font-size: 22px;
        letter-spacing: -0.7px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .brand .icon {
        width: 29px;
        height: 29px;
        color: var(--accent);
      }
      .top {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .top-inner {
        max-width: 1200px;
        padding: 15px 28px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .spread {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .prototype {
        padding: 7px 20px;
        background: var(--sunken);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .prototype button {
        font-size: 11px;
        padding: 2px 7px;
        border: 0;
        background: transparent;
        color: var(--accent);
      }
      .shell {
        max-width: 1200px;
        padding: 0 28px 32px;
        margin: auto;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 9px;
        padding: 19px 0 16px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 26px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
      }
      .step b {
        width: 23px;
        height: 23px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        flex: none;
      }
      .step.active {
        color: var(--accent);
        font-weight: 750;
      }
      .step.active b {
        background: var(--accent);
        color: var(--on);
        border-color: var(--accent);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: -0.8px;
        margin: 6px 0 9px;
      }
      h2 {
        font-size: 18px;
        line-height: 1.35;
        margin: 0 0 8px;
        letter-spacing: -0.25px;
      }
      h3 {
        font-size: 14px;
        margin: 0 0 7px;
      }
      p {
        margin: 0 0 12px;
      }
      .muted {
        color: var(--muted);
      }
      .tiny {
        font-size: 12px;
      }
      .micro {
        font-size: 11px;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
      }
      .heading p {
        margin: 0;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 650;
        white-space: nowrap;
        border-radius: 30px;
        background: var(--sunken);
        color: var(--muted);
        padding: 3px 9px;
      }
      .pill.green {
        color: var(--green);
        background: var(--green-bg);
      }
      .pill.amber {
        color: var(--amber);
        background: var(--amber-bg);
      }
      .pill.teal {
        color: var(--accent);
        background: var(--soft);
      }
      .dot {
        width: 6px;
        height: 6px;
        background: currentColor;
        border-radius: 50%;
      }
      .card {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .card.accent {
        border-color: color-mix(in srgb, var(--accent) 50%, var(--line));
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 20px;
        align-items: start;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .section-head h2,
      .section-head h3 {
        margin: 0;
      }
      .context {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 20px;
        padding: 16px;
      }
      .context-copy {
        flex: 1;
        min-width: 0;
      }
      .context h2 {
        font-size: 18px;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .context p {
        margin: 0 0 9px;
        font-size: 12px;
      }
      .map {
        width: 140px;
        height: 100px;
        flex: none;
        border-radius: 10px;
        overflow: hidden;
        background: var(--soft);
        position: relative;
      }
      .map svg {
        width: 100%;
        height: 100%;
      }
      .map-caption {
        font-size: 9px;
        position: absolute;
        bottom: 4px;
        left: 5px;
        background: var(--surface);
        padding: 1px 4px;
        border-radius: 3px;
        color: var(--muted);
      }
      .review-list {
        padding: 0;
        overflow: hidden;
      }
      .review-row {
        border: 0;
        border-radius: 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        width: 100%;
        text-align: left;
        justify-content: initial;
        gap: 13px;
        padding: 17px 18px;
        background: var(--surface);
        font-weight: 400;
        transition: background 160ms;
      }
      .review-row:last-child {
        border-bottom: 0;
      }
      .review-row:hover {
        background: var(--bg);
      }
      .tile {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--soft);
        color: var(--accent);
        display: grid;
        place-items: center;
        flex: none;
      }
      .review-copy {
        flex: 1;
        min-width: 0;
      }
      .review-copy strong {
        font-size: 14px;
        display: block;
        margin-bottom: 3px;
      }
      .review-copy span {
        display: block;
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .review-row > .icon {
        width: 17px;
        color: var(--accent);
      }
      .review-row .pill {
        font-size: 10px;
      }
      .label {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
      }
      .value {
        font-size: 26px;
        line-height: 1.15;
        font-weight: 760;
        letter-spacing: -0.7px;
      }
      .metric-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .metric {
        padding: 13px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .metric .value {
        font-size: 21px;
      }
      .metric .label {
        font-size: 11px;
      }
      .insight {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        text-align: left;
        width: 100%;
        padding: 16px;
      }
      .insight > div:not(.tile) {
        flex: 1;
      }
      .insight p {
        font-weight: 400;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .note {
        border-radius: 9px;
        padding: 11px 12px;
        background: var(--soft);
        color: var(--accent);
        font-size: 12px;
        margin: 14px 0 0;
      }
      .warning {
        background: var(--amber-bg);
        color: var(--amber);
      }
      .divider {
        border-top: 1px solid var(--line);
        margin: 16px 0;
      }
      .field {
        display: block;
        margin-bottom: 14px;
      }
      .field > span {
        display: block;
        font-size: 12px;
        font-weight: 650;
        margin-bottom: 6px;
      }
      .input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        padding: 9px 11px;
        min-height: 40px;
      }
      .full {
        width: 100%;
      }
      .report-card p {
        font-size: 12px;
      }
      .report-card .input {
        font-size: 13px;
      }
      .doc-list {
        display: grid;
        gap: 9px;
        font-size: 12px;
      }
      .doc-list > div {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .doc-list .icon {
        width: 16px;
        height: 16px;
        color: var(--accent);
        margin-top: 2px;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 22px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        font-size: 12px;
      }
      .progress {
        display: flex;
        height: 8px;
        gap: 3px;
        margin: 12px 0;
        border-radius: 20px;
        overflow: hidden;
      }
      .progress span {
        background: var(--accent);
        flex: 1;
      }
      .legend {
        display: grid;
        gap: 8px;
        font-size: 12px;
      }
      .legend > div {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .stamp {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .intro {
        padding: 16px;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 20px;
      }
      .intro p {
        font-size: 12px;
        margin: 5px 0 0;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .facts dt {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .facts dd {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      .detail-section {
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
      }
      .detail-section:first-child {
        padding-top: 0;
      }
      .detail-section:last-child {
        border-bottom: 0;
      }
      .detail-section p {
        font-size: 12px;
        color: var(--muted);
      }
      .detail-section .facts {
        margin: 0;
      }
      .detail-section h3 {
        margin-bottom: 12px;
      }
      .check {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        font-size: 12px;
        margin: 10px 0;
      }
      .check .icon {
        width: 17px;
        height: 17px;
        margin-top: 2px;
        color: var(--green);
      }
      .check small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .evidence-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 15px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .evidence-row small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .table th,
      .table td {
        padding: 10px 0;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      .table th {
        color: var(--muted);
        font-weight: 500;
      }
      .table td:last-child,
      .table th:last-child {
        text-align: right;
      }
      .bar-row {
        display: grid;
        grid-template-columns: 88px 1fr 55px;
        gap: 9px;
        align-items: center;
        font-size: 12px;
        margin: 16px 0;
      }
      .bar-track {
        height: 12px;
        border-radius: 4px;
        background: var(--sunken);
        overflow: hidden;
      }
      .bar {
        height: 100%;
        background: var(--accent);
      }
      .bar.baseline {
        background: #9bbcc4;
      }
      .bar.target {
        background: none;
        border-right: 3px solid var(--accent);
        border-left: 0;
      }
      .timeline > div {
        display: flex;
        gap: 11px;
        margin-bottom: 18px;
        font-size: 12px;
      }
      .timeline b.num {
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        background: var(--soft);
        color: var(--accent);
        border-radius: 50%;
        flex: none;
      }
      .timeline p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .drawer {
        position: fixed;
        inset: 0 0 0 auto;
        margin: 0;
        width: min(560px, 100%);
        max-width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        padding: 0;
        border: 0;
        border-left: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        box-shadow: -12px 0 45px #08172422;
        overflow: hidden;
      }
      .drawer[open] {
        display: flex;
        flex-direction: column;
        animation: drawerIn 260ms cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .drawer::backdrop {
        background: #08172438;
        animation: fadeIn 180ms ease;
      }
      .drawer.closing {
        animation: drawerOut 180ms ease forwards;
      }
      .drawer.closing::backdrop {
        animation: fadeOut 180ms ease forwards;
      }
      .drawer-head {
        position: relative;
        padding: 22px 24px 18px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .drawer-head h2 {
        font-size: 22px;
        margin: 7px 32px 7px 0;
        line-height: 1.3;
      }
      .drawer-head p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
      .drawer-close {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 22px;
        font-weight: 400;
      }
      .drawer-body {
        padding: 20px 24px;
        overflow: auto;
        min-height: 0;
        flex: 1;
      }
      .drawer-footer {
        padding: 16px 24px 20px;
        border-top: 1px solid var(--line);
        background: var(--surface);
        flex: none;
      }
      .drawer-footer p {
        font-size: 11px;
        color: var(--muted);
        margin: 9px 0 0;
      }
      .drawer-footer .row {
        justify-content: space-between;
      }
      .drawer-back {
        font-size: 12px;
        margin: 0 0 13px;
      }
      .switches {
        display: flex;
        gap: 6px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .switches button {
        font-size: 11px;
        padding: 5px 8px;
      }
      .switches .active {
        background: var(--soft);
        border-color: var(--accent);
        color: var(--accent);
      }
      .doc-page {
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 23px;
        box-shadow: var(--shadow);
      }
      .doc-page h3 {
        font-size: 19px;
        line-height: 1.35;
        margin: 12px 0;
      }
      .doc-page h4 {
        font-size: 12px;
        margin: 20px 0 8px;
      }
      .doc-page p {
        font-size: 11px;
        color: var(--muted);
      }
      .ready-banner {
        padding: 16px 18px;
        background: var(--green-bg);
        color: var(--green);
        border: 1px solid color-mix(in srgb, var(--green) 30%, var(--line));
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .ready-banner p {
        margin: 3px 0 0;
        font-size: 12px;
      }
      .funding-option {
        padding: 18px;
      }
      .funding-option p {
        font-size: 12px;
        margin: 4px 0 12px;
      }
      .funding-option .section-head {
        margin-bottom: 4px;
      }
      .loader {
        width: 30px;
        height: 30px;
        border: 3px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
        margin: 28px auto 18px;
      }
      .demo-error {
        font-size: 12px;
        color: var(--amber);
        margin-bottom: 12px;
      }
      body:has(.drawer[open]) {
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }
      @keyframes drawerIn {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }
      @keyframes drawerOut {
        to {
          transform: translateX(100%);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeOut {
        to {
          opacity: 0;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 850px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .shell {
          padding-inline: 18px;
        }
        .steps {
          overflow: auto;
          grid-template-columns: repeat(6, 140px);
        }
        .context {
          flex-wrap: wrap;
        }
        .map {
          width: 105px;
          height: 95px;
        }
        .context-copy {
          min-width: 200px;
        }
        .heading {
          align-items: flex-start;
        }
        .grid2 {
          grid-template-columns: 1fr;
        }
        .review-row .pill {
          display: none;
        }
        .top-inner {
          padding-inline: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const paths = {

        if (fundingStep === 'review') return proposalReview();
        if (fundingStep === 'submit') return submitContent();
        return `${drawerHead('Funding opportunity', 'Municipal water conservation grant', 'Sample city water authority · illustrative scheme')}<div class="drawer-body"><div class="row wrap" style="margin-bottom:18px">${pill('Meets listed rules', 'green')}${pill('Not submitted', 'amber')}</div><div class="metric-grid"><div class="metric"><span class="label">Potential support</span><div class="value">₹3 lakh</div></div><div class="metric"><span class="label">Sample deadline</span><b>30 Nov 2026</b></div></div><section class="detail-section"><h3>Why this fits</h3><p>Supports community rainwater harvesting and recharge in the selected sample service area.</p>${['Location within service area', 'Resident association applicant', 'Proposed works covered', 'Project cost within limits', 'Example application window open'].map((t) => `<div class="check">${icon('check')}${t}</div>`).join('')}</section><section class="detail-section"><h3>Documents needed</h3><div class="doc-list">${['Project proposal · WaterPilot can draft', 'Cost estimate & selected plan · saved', 'Association registration · to add', 'Site authorization · to add'].map((t) => `<div>${icon('file')}${t}</div>`).join('')}</div></section><section class="detail-section"><h3>Publisher source</h3><p>Sample programme guidelines · checked 18 Oct 2026.</p>${btn('View official source ' + icon('external'), 'sourceNotice()', 'link tiny')}</section></div><footer class="drawer-footer">${fundingSelected ? `<h3>Prepare a proposal for this scheme?</h3><p style="margin:0 0 12px">Saved project details are prefilled. You can review everything before downloading.</p><div class="row">${btn('Yes, prepare draft', "openFunding('prepare')", 'primary')}${btn('Not now', 'closeDrawer()', 'link tiny')}</div>` : `<div class="row">${btn('Select this scheme', 'fundingSelected=true;paintDrawer()', 'primary')}${btn('Keep exploring', 'closeDrawer()', 'link tiny')}</div><p>Selection is a funding intention, not an approved award.</p>`}</footer>`;
      }
      const draftField = (key, label, type = 'text', placeholder = '') =>
        `<label class="field"><span>${label}</span><input class="input" name="${key}" type="${type}" value="${esc(draft[key] || '')}" placeholder="${placeholder}" ${['applicant', 'contact', 'email', 'amount'].includes(key) ? 'required' : ''} oninput="draft['${key}']=this.value"></label>`;
      function prepareContent() {
        return `${drawerHead('Proposal · confirm details', 'Prepare your proposal', 'Municipal water conservation grant', "openFunding('details')")}<div class="drawer-body"><div class="intro"><b>We have your project information</b><p>Rainwater & recharge plan · ₹8.2 lakh · goal: 40% less tanker dependence. Saved baseline and source references will be included.</p></div>${formError ? `<p class="demo-error" role="alert">${formError}</p>` : ''}<form id="proposal-form" onsubmit="event.preventDefault();generateProposal()">${draftField('applicant', 'Applicant / association name *', 'text', 'Organization name')}<div class="grid2">${draftField('contact', 'Contact person *', 'text', 'Full name')}${draftField('email', 'Contact email *', 'email', 'name@example.com')}</div>${draftField('amount', 'Requested support (INR) *', 'text', 'Enter amount')}<label class="field"><span>Additional context</span><textarea class="input" rows="2" placeholder="Local priorities or community commitments" oninput="draft.notes=this.value">${esc(draft.notes)}</textarea></label></form><section class="detail-section"><h3>The draft will include</h3><div class="doc-list">${['Cover letter & funding request', 'Need, goal & available baseline', 'Works, budget & timeline', 'Monitoring, sources & attachment checklist'].map((t) => `<div>${icon('check')}${t}</div>`).join('')}</div></section><p class="note">Missing measurements are marked “To be provided”. Estimates stay labelled as estimates.</p></div><footer class="drawer-footer"><div class="row">${btn('Back', "openFunding('details')", 'link tiny')}<button class="primary" type="submit" form="proposal-form">${icon('file')} Generate proposal draft</button></div><p>No application is sent. You will review the draft next.</p></footer>`;
      }
      function generateProposal() {
        const form = document.getElementById('proposal-form');
        if (!form.reportValidity()) return;
        const amount = Number(draft.amount.replace(/,/g, ''));
        if (!Number.isFinite(amount) || amount <= 0 || amount > 300000) {
          formError = 'Enter a request above ₹0 and within the sample ₹3 lakh cap.';
          paintDrawer();
          return;
        }
        formError = '';
        fundingStep = 'generating';
        paintDrawer();
        genTimer = setTimeout(() => {
          fundingStep = 'review';
          paintDrawer();
        }, 1200);
      }
      function cancelGeneration() {
        clearTimeout(genTimer);
        genTimer = null;
        openFunding('prepare');
      }
      function proposalDocument() {
        return `<article class="doc-page"><span class="eyebrow" style="font-size:9px">WaterPilot · proposal draft</span><h3>Community rainwater harvesting & recharge</h3><p>${esc(draft.applicant)}<br>Parkway Homes, Bengaluru · illustrative preview</p><h4>Funding request</h4><p>Requested support: ₹${esc(draft.amount)} towards the proposed ₹8.2 lakh community project.</p><h4>Need & objective</h4><p>The saved goal is a 40% reduction in tanker dependence. The plan’s estimated reduction is 30–45%; achievement is not guaranteed.</p><h4>Proposed works</h4><p>Rainwater collection and storage, two recharge wells, leak repairs and monitoring. Estimated implementation: 45–60 days, subject to site permissions.</p><h4>Budget & implementation</h4><table class="table"><tr><td>Estimated project cost</td><td>₹8,20,000</td></tr><tr><td>Requested grant</td><td>₹${esc(draft.amount)}</td></tr><tr><td>Planned contribution</td><td>₹2,00,000</td></tr></table><h4>Evidence & attachments</h4><p>Saved plan, goal, scenario and available baseline. Registration and site authorization must be added before applying.</p><p class="micro" style="margin:18px 0 0">AI-assisted draft · examples only · not submitted.</p></article>`;
      }
      function proposalReview() {
        return `${drawerHead('Proposal · review & download', 'Your proposal draft', 'Review the text and attachments before sending.', "openFunding('prepare')")}<div class="drawer-body"><div class="row spread" style="margin-bottom:14px">${pill('Draft ready', 'green')}${btn(icon('edit') + ' Edit details', "openFunding('prepare')", 'link tiny')}</div>${proposalDocument()}<div class="note warning">Registration and site authorization still need to be attached.</div></div><footer class="drawer-footer"><div class="row wrap">${btn(icon('download') + ' PDF', "previewDownload('Proposal PDF')", 'primary')}${btn('Editable DOCX', "previewDownload('Proposal DOCX')", 'secondary')}${btn('How to submit ' + icon('arrow'), "openFunding('submit')", 'link tiny')}</div><p>Downloads are illustrative in this design preview.</p></footer>`;
      }
      function submitContent() {
        return `${drawerHead('Proposal · submission guide', 'How to send your proposal', 'Follow the selected scheme’s verified submission route.', "openFunding('review')")}<div class="drawer-body"><div class="intro"><b>Municipal water conservation grant</b><p>Sample publisher · example deadline 30 Nov 2026</p></div><div class="timeline">${[
          ['Review & sign', 'Check the proposal, cost figures and authorized signatory.'],
          [
            'Attach supporting documents',
            'Registration, site permission, selected plan and cost estimate.',
          ],
          [
            'Submit on the official portal',
            'Upload the proposal and attachments. Save your acknowledgement number.',
          ],
          [
            'Record the outcome',
            'Keep submission and approval status separate from the funding amount requested.',
          ],
        ]
          .map(
            ([h, t], i) =>
              `<div><b class="num">${i + 1}</b><section><b>${h}</b><p>${t}</p></section></div>`,
          )
          .join(
            '',
          )}</div><p class="note">Email or offline schemes will show their verified recipient or office address here. If the route is unknown, it will be marked “Needs confirmation”.</p></div><footer class="drawer-footer"><div class="row">${btn('Back to proposal', "openFunding('review')", 'link tiny')}${btn('Open official portal ' + icon('external'), 'sourceNotice()', 'primary')}</div><p>You submit the application. WaterPilot does not send it automatically.</p></footer>`;
      }
      function finalContent() {
        return `${drawerHead('Save your reviewed plan', 'Finalize report', 'Create a read-only snapshot of the details you reviewed.')}<div class="drawer-body"><div class="intro"><b>${esc(reportTitle)}</b><p>Area, scenario, goal, selected plan, expected impact, funding intentions and evidence.</p></div><div class="check">${icon('check')}Current saved inputs are used</div><div class="check">${icon('check')}Estimates and unknowns stay labelled</div><div class="check">${icon('check')}Funding requests remain unapproved</div><div class="check">${icon('check')}Your report stays private</div><div class="note">Finalization saves your report. It does not approve the project, submit a proposal or start construction.</div></div><footer class="drawer-footer"><div class="row">${btn('Keep reviewing', 'closeDrawer()', 'secondary')}${btn('Finalize & save report', 'finalizeDemo()', 'primary')}</div><p>Design simulation only. No real report or account is changed.</p></footer>`;
      }
      function editReview() {
        return `${drawerHead('Review mode', 'Saved details are read-only', 'Keep this review separate from the earlier planning forms.')}<div class="drawer-body"><p class="tiny muted">When editing is enabled, an explicit “Edit” action will update the relevant fields and recheck dependent calculations. Viewing a section here never changes the plan.</p></div><footer class="drawer-footer">${btn('Back to review', 'closeDrawer()', 'primary')}</footer>`;
      }
      function savedReport() {
        return `${drawerHead('Final report · read-only', 'Saved report snapshot', reportTitle)}<div class="drawer-body"><div class="intro"><b>Reviewed information is preserved</b><p>This design simulates the report created after finalization.</p></div><div class="doc-list">${['Area and water context', 'Applied future scenario', 'Goal, target and constraints', 'Selected works, cost and impact', 'Funding intentions & proposal status', 'Sources, assumptions and limitations'].map((t) => `<div>${icon('check')}${t}</div>`).join('')}</div><p class="note">A report and a funding proposal are different documents. Each is downloaded separately.</p></div><footer class="drawer-footer">${btn(icon('download') + ' Download report PDF', "previewDownload('Final report PDF')", 'primary')}</footer>`;
      }
      function openDrawer(k) {
        clearTimeout(genTimer);
        drawerKey = k;
        formError = '';
        paintDrawer();
        const d = document.getElementById('review-drawer');
        if (!d.open) d.showModal();
      }
      function openFunding(step = 'details') {
        fundingStep = step;
        openDrawer('funding-workspace');
      }
      function paintDrawer() {
        const d = document.getElementById('review-drawer');
        d.classList.remove('closing');
        d.innerHTML =
          drawerKey === 'funding-workspace'
            ? fundingContent()
            : drawerKey === 'finalize'
              ? finalContent()
              : drawerKey === 'saved'
                ? savedReport()
                : drawerKey === 'funding-info'
                  ? `${drawerHead('Funding opportunity', 'One detail to confirm', 'Sample corporate foundation')}<div class="drawer-body"><p class="tiny muted">Confirm applicant registration to complete eligibility checks.</p><label class="field"><span>Applicant registration status</span><select class="input"><option>Not confirmed</option><option>Registered</option><option>Not registered</option></select></label></div><footer class="drawer-footer">${btn('Done', 'closeDrawer()', 'primary')}</footer>`
                  : reviewContent(drawerKey);
        if (d.open) {
          d.querySelector('#drawer-title').focus();
          d.querySelector('.drawer-body').scrollTop = 0;
        }
      }
      function closeDrawer() {
        clearTimeout(genTimer);
        const d = document.getElementById('review-drawer');
        d.classList.add('closing');
        setTimeout(() => {
          d.close();
          d.classList.remove('closing');
        }, 180);
      }
      function finalizeDemo() {
        finalized = true;
        render();
        scrollTo(0, 0);
      }
      function demoSignIn() {
        signed = true;
        render();
      }
      function previewDownload(name) {
        alert(
          'Design preview: ' +
            name +
            ' export will be implemented after approval. No document is generated in this mockup.',
        );
      }
      function sourceNotice() {
        alert(
          'Design preview: opens the verified publisher URL in the live application. All sources here are illustrative.',
        );
      }
      function demoState(s) {
        finalized = s === 'final';
        signed = s !== 'guest';
        missing = s === 'stale';
        view = 'action';
        render();
      }
      function render() {
        document.getElementById('app').innerHTML =
          `<div class="prototype"><b>DESIGN PREVIEW · Sample data · No live records changed</b><button onclick="view='action';render()">Take Action</button><button onclick="view='funding';render()">Funding & proposal flow</button><button onclick="demoState('guest')">Guest</button><button onclick="demoState('member')">Signed in</button><button onclick="demoState('stale')">Recheck needed</button><button onclick="demoState('final')">Finalized</button></div><header class="top"><div class="top-inner"><div class="brand">${icon('droplet')}WaterPilot</div><div class="row"><button class="small" aria-label="Toggle light and dark theme" onclick="theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;render()">${icon('sun')}</button>${pill(signed ? 'Member' : 'Guest')}</div></div></header><main class="shell">${steps()}<div id="page-content">${view === 'funding' ? fundingPage() : actionPage()}</div></main><dialog class="drawer" id="review-drawer" aria-labelledby="drawer-title"></dialog>`;
        const d = document.getElementById('review-drawer');
        d.addEventListener('cancel', (e) => {
          e.preventDefault();
          closeDrawer();
        });
        d.addEventListener('click', (e) => {
          if (e.target === d) {
            const r = d.getBoundingClientRect();
            if (e.clientX < r.left || e.clientX > r.right) closeDrawer();
          }
        });
      }
      render();
    </script>
  </body>
</html>
