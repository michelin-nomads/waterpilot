type Mutation {
  createPlanningSession(input: CreatePlanningSessionInput!): PlanningSessionPayload!
  updatePlanningSession(input: UpdatePlanningSessionInput!): PlanningSessionPayload!

  """
  Store a location you confirmed and return its area. Set the session's areaId afterwards with updatePlanningSession.
  """
  confirmLocation(input: ConfirmLocationInput!): ConfirmLocationPayload!

  """Record a value you know for your session's area."""
  recordManualInput(input: RecordManualInputInput!): ManualInputPayload!

  """Evaluate catalogue criteria for a session's plan option."""
  matchFunding(input: MatchFundingInput!): MatchFundingPayload!

  """Create an immutable report from the session."""
  finalizeReport(input: FinalizeReportInput!): ReportPayload!
  archiveReport(input: ArchiveReportInput!): ReportPayload!

  """Queue a durable proposal-drafting job."""
  generateProposal(input: GenerateProposalInput!): ProposalPayload!
  createCommunity(input: CreateCommunityInput!): CommunityPayload!

  """Join immediately (no approval step)."""
  joinCommunity(input: JoinCommunityInput!): MembershipPayload!
  leaveCommunity(input: LeaveCommunityInput!): MembershipPayload!

  """Coordinators only; the community becomes read-only."""
  archiveCommunity(input: ArchiveCommunityInput!): CommunityPayload!
  startImplementationProject(input: StartImplementationProjectInput!): ImplementationProjectPayload!
  updateMilestone(input: UpdateMilestoneInput!): MilestonePayload!
  recordObservation(input: RecordObservationInput!): ObservationPayload!

  """
  Guests only. Starts a 10-minute, one-use claim on this guest's work and returns its secret once. A retry issues a new claim and cancels the previous one.
  """
  beginAccountClaim: BeginAccountClaimPayload!

  """
  Signed-in accounts only, within 5 minutes of signing in. Moves the guest's active planning session to this account; nothing else is merged.
  """
  completeAccountClaim(input: CompleteAccountClaimInput!): AccountClaimPayload!

  """Guests only: cancel your open claim."""
  cancelAccountClaim(input: CancelAccountClaimInput!): AccountClaimPayload!
}

"""An expected failure of a mutation. Safe to show."""
