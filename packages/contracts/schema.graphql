  Region settings a confirmation would infer for a point in a country, with how certain each is. Never derived from the interface language.
  """
  regionSettings(latitude: DecimalString!, longitude: DecimalString!, countryCode: String!): RegionSettings!

  """Countries (ISO 3166-1 alpha-2) with English names, from CLDR."""
  countries: CountryList!
  fundingScheme(id: ID!): FundingScheme
  fundingSchemes(currency: String = null, first: Int = null, after: String = null): FundingSchemeConnection!
  fundingMatches(sessionId: ID!, planOptionId: ID = null, first: Int = null, after: String = null): FundingMatchConnection!
  report(id: ID!): Report
  reports(filter: ReportFilter = null, first: Int = null, after: String = null): ReportConnection!
  proposal(id: ID!): Proposal
  community(id: ID!): Community
  communities(filter: CommunityFilter = null, first: Int = null, after: String = null): CommunityConnection!

  """Active communities within the radius, nearest first."""
  nearbyCommunities(near: NearbyCommunitiesInput!, first: Int = null, after: String = null): NearbyCommunityConnection!
  myMemberships(first: Int = null, after: String = null): MembershipConnection!
  implementationProject(id: ID!): ImplementationProject
  myImplementationProjects(first: Int = null, after: String = null): ImplementationProjectConnection!
  job(id: ID!): Job
  agentRun(id: ID!): AgentRun
  agentRuns(sessionId: ID!, first: Int = null, after: String = null): AgentRunConnection!
  aiStatus: AiStatus!
