fragment ProjectFields on ImplementationProject {
  id
  version
  reportId
  reportVersion
  areaId
  communityId
  sharedWithCommunity
  title
  status
  startedAt
  expenses {
    description
    spentOn
    source
    amount {
      ...MoneyFields
    }
  }
}

fragment MilestoneFields on Milestone {
  id
  version
  projectId
  title
  plannedOn
  responsibleIdentity
  tasks
  status
  completedOn
  completedAt
}

fragment ObservationFields on Observation {
  id
  version
  projectId
  metricId
  observedOn
  method
  sourceType
  source
  permittedSourceConfirmed
  areaId
  windowStart
  windowEnd
  coverageObservedDays
  coverageExpectedDays
  note
  evidence
  recordedByViewer
  comparison {
    status
    reason
    relation
    forecastLow {
      value
      unit
    }
    forecastHigh {
      value
      unit
    }
  }
  quantity {
    ...QuantityFields
  }
}

query MyImplementationProjects($first: Int, $after: String) {
  myImplementationProjects(first: $first, after: $after) {
    nodes {
      ...ProjectFields
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

query ImplementationProject($id: ID!) {
  implementationProject(id: $id) {
    ...ProjectFields
    milestones(first: 30) {
      nodes {
        ...MilestoneFields
      }
      pageInfo {
        ...PageInfoFields
      }
    }
  }
}

query TrackingReports($first: Int, $after: String) {
  reports(filter: { status: FINALIZED }, first: $first, after: $after) {
    nodes {
      id
      version
      title
      status
      communityId
      areaId
      finalizedAt
      goal {
        horizonDays
      }
      impact {
        metrics {
          metricId
          projectedLow {
            quantity {
              value
              unit
            }
          }
          projectedHigh {
            quantity {
              value
              unit
            }
          }
        }
      }
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

query TrackingReport($id: ID!) {
  report(id: $id) {
    id
    version
    title
    status
    communityId
    areaId
    finalizedAt
    goal {
      horizonDays
    }
    impact {
      metrics {
        metricId
        projectedLow {
          quantity {
            value
            unit
          }
        }
        projectedHigh {
          quantity {
            value
            unit
          }
        }
      }
    }
  }
}

query Observations($projectId: ID!, $first: Int, $after: String) {
  implementationProject(id: $projectId) {
    id
    observations(first: $first, after: $after) {
      nodes {
        ...ObservationFields
      }
      pageInfo {
        ...PageInfoFields
      }
    }
  }
}

mutation StartImplementationProject($input: StartImplementationProjectInput!) {
  startImplementationProject(input: $input) {
    project {
      ...ProjectFields
    }
    error {
      ...MutationErrorFields
    }
  }
}

mutation UpdateMilestone($input: UpdateMilestoneInput!) {
  updateMilestone(input: $input) {
    milestone {
      ...MilestoneFields
    }
    error {
      ...MutationErrorFields
    }
  }
}

mutation RecordObservation($input: RecordObservationInput!) {
  recordObservation(input: $input) {
    observation {
      ...ObservationFields
    }
    error {
      ...MutationErrorFields
    }
  }
}

mutation AddProjectExpense($input: AddProjectExpenseInput!) {
  addProjectExpense(input: $input) {
    project {
      ...ProjectFields
    }
    error {
      ...MutationErrorFields
    }
  }
}

mutation UpdateProjectStatus($input: UpdateProjectStatusInput!) {
  updateProjectStatus(input: $input) {
    project {
      ...ProjectFields
    }
    error {
      ...MutationErrorFields
    }
  }
}
