fragment AreaFields on Area {
  id
  name
  countryCode
  timezone
  evidence
}

fragment PlanningSessionFields on PlanningSession {
  id
  version
  mode
  stage
  baselineReviewed
  status
  areaId
  communityId
  selectedPlanOptionId
  communityBaseline {
    areaId
    concern
    notes
    residents
    dailyUse
    demandEstimated
    demandSource
    asOf
    supplyComplete
    sources {
      name
      kind
      method
      quantity
      multiplier
      periodDays
      estimated
      source
    }
  }
  siteProfile {
    communityType
    occupiedHomes
  }
  inputsRevision
  updatedAt
  area {
    id
    name
    extent
    radiusMeters
    hasBoundary
    extent
    radiusMeters
    hasBoundary
  }
  goal {
    id
    kind
    description
    targetParameter
    timelineDays
    horizonDays
    priority
    also
    confirmed
    preferredInterventions
    waterTariff {
      price {
        ...MoneyFields
      }
      volume {
        ...QuantityFields
      }
      note
    }
    contingencyRatio
    funding {
      label
      amount {
        ...MoneyFields
      }
      status
      note
    }
    budget {
      ...MoneyFields
    }
    target {
      mode
      quantity {
        ...QuantityFields
      }
    }
    site {
      scale
      storageSpace
      pipedSupply
      groundwaterUse
      restrictions
      roofArea {
        ...QuantityFields
      }
      openGround {
        ...QuantityFields
      }
    }
    estimates {
      interventionId
      note
      cost {
        low {
          ...MoneyFields
        }
        high {
          ...MoneyFields
        }
      }
      recurring {
        low {
          ...MoneyFields
        }
        high {
          ...MoneyFields
        }
      }
      buildDays {
        low
        high
      }
      effects {
        key
        low
        high
      }
    }
  }
  scenario {
    id
    confirmed
    interpretedFrom
    adjustments {
      parameter
      change
      quantity {
        ...QuantityFields
      }
    }
  }
}

query Viewer {
  viewer {
    uid
    kind
  }
}

query SearchAreas($query: String!, $first: Int, $after: String) {
  searchAreas(query: $query, first: $first, after: $after) {
    nodes {
      ...AreaFields
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

query AreaCoverage($id: ID!) {
  area(id: $id) {
    ...AreaFields
    coverage {
      assessedAt
      items {
        capability
        availability
        evidence
        reason
      }
    }
  }
}

query CurrentPlanningSession {
  currentPlanningSession {
    ...PlanningSessionFields
  }
}

query PlanningSession($id: ID!) {
  planningSession(id: $id) {
    ...PlanningSessionFields
  }
}

query PlanOptions($sessionId: ID!, $first: Int, $after: String) {
  planOptions(sessionId: $sessionId, first: $first, after: $after) {
    nodes {
      id
      inputsRevision
      name
      summary
      feasibility
      bestFitReason
      costUnavailableReason
      costBasisDate
      cost {
        low {
          ...MoneyFields
        }
        high {
          ...MoneyFields
        }
      }
      buildDays {
        low
        high
      }
      impact {
        id
        assumptions
        metrics {
          metricId
          baseline {
            availability
            reason
            quantity {
              ...QuantityFields
            }
          }
          projectedLow {
            availability
            reason
            quantity {
              ...QuantityFields
            }
          }
          projectedHigh {
            availability
            reason
            quantity {
              ...QuantityFields
            }
          }
        }
        neighbourEffect {
          availability
          reason
        }
      }
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

mutation CreatePlanningSession($input: CreatePlanningSessionInput!) {
  createPlanningSession(input: $input) {
    session {
      ...PlanningSessionFields
    }
    error {
      ...MutationErrorFields
    }
  }
}

mutation UpdatePlanningSession($input: UpdatePlanningSessionInput!) {
  updatePlanningSession(input: $input) {
    session {
      ...PlanningSessionFields
    }
    error {
      ...MutationErrorFields
    }
  }
}
