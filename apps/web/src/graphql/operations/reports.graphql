fragment JobFields on Job {
  id
  version
  kind
  status
  stage
  attempts
  maxAttempts
  errorCode
  eventsPath
  updatedAt
}

fragment ReportFields on Report {
  id
  version
  title
  status
  sessionId
  communityId
  areaId
  planOptionId
  planName
  goal {
    id
    kind
    description
  }
  economics {
    engineVersion
    currency
    capex {
      low {
        ...MoneyFields
      }
      high {
        ...MoneyFields
      }
    }
    upfrontTotal {
      low {
        ...MoneyFields
      }
      high {
        ...MoneyFields
      }
    }
    recurringAnnual {
      low {
        ...MoneyFields
      }
      high {
        ...MoneyFields
      }
    }
    avoidedTankerAnnual {
      low {
        ...MoneyFields
      }
      high {
        ...MoneyFields
      }
    }
    netAnnual {
      low {
        ...MoneyFields
      }
      high {
        ...MoneyFields
      }
    }
    funding {
      totalCost {
        low {
          ...MoneyFields
        }
        high {
          ...MoneyFields
        }
      }
      approved {
        ...MoneyFields
      }
      gap {
        low {
          ...MoneyFields
        }
        high {
          ...MoneyFields
        }
      }
      candidate {
        ...MoneyFields
      }
      fullyFunded
      note
    }
    assumptions
    notes
  }
  finalizedAt
  archivedAt
}

fragment ProposalFields on Proposal {
  id
  version
  reportId
  sections
  status
  flaggedCount
  downloadPath
  previewPath
  job {
    ...JobFields
  }
}

query Reports($filter: ReportFilter, $first: Int, $after: String) {
  reports(filter: $filter, first: $first, after: $after) {
    nodes {
      ...ReportFields
      area {
        id
        name
        countryCode
      }
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

query FundingSchemes($first: Int, $after: String) {
  fundingSchemes(first: $first, after: $after) {
    nodes {
      id
      name
      funder
      summary
      status
      evidence
      officialSource
      sourceUrl
      sourceHash
      lastVerifiedAt
      currency
      maxAmount {
        ...MoneyFields
      }
      deadlineAt
      deadlineTimezone
      requiredDocuments
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

query Report($id: ID!) {
  report(id: $id) {
    ...ReportFields
    area {
      id
      name
      countryCode
    }
    impact {
      metrics {
        metricId
        baseline {
          availability
          quantity {
            value
            unit
          }
          reason
        }
        projectedLow {
          availability
          quantity {
            value
            unit
          }
          reason
        }
        projectedHigh {
          availability
          quantity {
            value
            unit
          }
          reason
        }
      }
      neighbourEffect {
        availability
        quantity {
          value
          unit
        }
        reason
      }
      assumptions
      provenance {
        evidence
        sourceIds
        asOf
      }
    }
    proposals(first: 10) {
      nodes {
        ...ProposalFields
      }
      pageInfo {
        ...PageInfoFields
      }
    }
  }
}

query Proposal($id: ID!) {
  proposal(id: $id) {
    ...ProposalFields
  }
}

query Job($id: ID!) {
  job(id: $id) {
    ...JobFields
  }
}

mutation FinalizeReport($input: FinalizeReportInput!) {
  finalizeReport(input: $input) {
    report {
      ...ReportFields
    }
    error {
      ...MutationErrorFields
    }
  }
}

mutation ArchiveReport($input: ArchiveReportInput!) {
  archiveReport(input: $input) {
    report {
      ...ReportFields
    }
    error {
      ...MutationErrorFields
    }
  }
}

mutation GenerateProposal($input: GenerateProposalInput!) {
  generateProposal(input: $input) {
    proposal {
      ...ProposalFields
    }
    error {
      ...MutationErrorFields
    }
  }
}
