<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaterLens loader preview</title>
    <style>
      /* Keep the visual demo animated even when the browser requests reduced motion. */
      g[class*='fillGroup'] {
        animation: _fill_f0b5o_24 8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards !important;
      }

      g[class*='waveTrack'] {
        animation: _drift_f0b5o_1 3.5s linear infinite !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';
      import '/src/styles/global.scss';
      import { WaterDropletLoader } from '/src/components/WaterDropletLoader/WaterDropletLoader.tsx';

      createRoot(document.getElementById('root')).render(
        createElement(WaterDropletLoader, { statusText: 'Loading WaterLens…' }),
      );
    </script>
  </body>
</html>
